
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificates & Achievements | Yusuf Muhammad Sani</title>

<style>
:root {
  color-scheme: dark;
  --bg: #071016;
  --card: #111e26;
  --green: #23d64a;
  --text: #f5f8f9;
  --muted: #b0c2c9;
  --border: #29404a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.6 "Segoe UI", Arial, sans-serif;
}
a { text-decoration: none; color: inherit; }
button, input, select { font: inherit; }
button, select { cursor: pointer; }
:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }
.container { max-width: 1150px; margin: auto; padding: 0 22px; }

header {
  padding: 20px 0;
  border-bottom: 1px solid var(--border);
}
.header-inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 20px;
}
.logo { font-size: 23px; font-weight: 800; }
.logo span { color: var(--green); }
nav { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
nav a:hover { color: var(--green); }

#language {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: white;
  padding: 9px;
}
.hero { padding: 75px 0 35px; }
.kicker { color: var(--green); font-weight: 700; }
h1 { font-size: clamp(32px, 5vw, 54px); margin: 10px 0; }
.description { max-width: 650px; color: var(--muted); }

#search {
  width: 100%;
  max-width: 500px;
  padding: 15px;
  margin: 20px 0;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: white;
}
.filters { display: flex; gap: 10px; flex-wrap: wrap; }
.filter {
  border: 1px solid var(--border);
  background: var(--card);
  color: white;
  padding: 10px 15px;
  border-radius: 25px;
}
.filter[aria-pressed="true"] {
  background: var(--green);
  color: #071016;
  font-weight: 700;
}
#count { color: var(--muted); margin: 25px 0; }

.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
  padding-bottom: 70px;
}
.card {
  padding: 25px;
  border: 1px solid var(--border);
  background: var(--card);
  border-radius: 18px;
  display: flex;
  flex-direction: column;
}
.category {
  align-self: flex-start;
  color: #b7fbc7;
  background: #163523;
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 13px;
}
.card h2 { font-size: 20px; margin-bottom: 8px; }
.card p { color: var(--muted); margin: 4px 0; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.actions a { padding: 10px 14px; border-radius: 9px; font-weight: 700; }
.view { background: var(--green); color: #071016; }
.download { border: 1px solid var(--green); color: #b7fbc7; }

#empty {
  padding: 45px 15px;
  color: var(--muted);
  text-align: center;
  border: 1px dashed var(--border);
  border-radius: 15px;
  margin-bottom: 70px;
}
footer {
  border-top: 1px solid var(--border);
  padding: 25px 0;
  color: var(--muted);
}
@media (max-width: 850px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 600px) {
  .grid { grid-template-columns: 1fr; }
  .hero { padding-top: 45px; }
}
</style>
</head>

<body>
<header>
  <div class="container header-inner">
    <a class="logo" href="index.html"><span>&lt;/&gt;</span> Yusuf</a>
    <nav>
      <a href="index.html" id="homeLink">Home</a>
      <a href="certificates.html" id="certLink" aria-current="page">Certificates</a>
      <select id="language" aria-label="Select language">
        <option value="en">English</option>
        <option value="ms">Bahasa Melayu</option>
        <option value="ar">العربية</option>
        <option value="zh">简体中文</option>
      </select>
    </nav>
  </div>
</header>

<main class="container">
  <section class="hero">
    <p class="kicker" id="kicker">Professional Development</p>
    <h1 id="title">Certificates & Achievements</h1>
    <p class="description" id="intro">
      Explore my academic achievements, professional training,
      leadership development, and volunteering experiences.
    </p>
  </section>

  <section aria-label="Certificate library">
    <input type="search" id="search"
      placeholder="Search certificates or organizations"
      aria-label="Search certificates">

    <div class="filters" id="filters"></div>
    <p id="count" aria-live="polite"></p>
    <div class="grid" id="grid"></div>
    <p id="empty" hidden></p>
  </section>
</main>

<footer>
  <div class="container">
    © <span id="year"></span> Yusuf Muhammad Sani
  </div>
</footer>

<script>
/*
  ADD YOUR REAL CERTIFICATES HERE.

  Upload the PDF into your GitHub "certificates" folder,
  then add an entry below using its exact filename.
*/
const certificates = [
  // Example format (do not publish fictitious credentials):
  // {
  //   title: "Certificate Name",
  //   issuer: "Issuing Organization",
  //   year: 2026,
  //   category: "technology",
  //   file: "certificates/certificate-name.pdf"
  // }
];

const translations = {
  en: {
    home: "Home", cert: "Certificates",
    kicker: "Professional Development",
    title: "Certificates & Achievements",
    intro: "Explore my academic achievements, professional training, leadership development, and volunteering experiences.",
    search: "Search certificates or organizations",
    all: "All", technology: "Data & Technology",
    academic: "Academic", leadership: "Leadership",
    volunteering: "Volunteering", training: "Workshops & Training",
    awards: "Awards", view: "View Certificate",
    download: "Download", results: "certificates found",
    empty: "No certificates have been added or matched your search."
  },
  ms: {
    home: "Laman Utama", cert: "Sijil",
    kicker: "Pembangunan Profesional",
    title: "Sijil & Pencapaian",
    intro: "Terokai pencapaian akademik, latihan profesional, kepimpinan dan pengalaman sukarelawan saya.",
    search: "Cari sijil atau organisasi",
    all: "Semua", technology: "Data & Teknologi",
    academic: "Akademik", leadership: "Kepimpinan",
    volunteering: "Kesukarelawanan", training: "Bengkel & Latihan",
    awards: "Anugerah", view: "Lihat Sijil",
    download: "Muat Turun", results: "sijil ditemui",
    empty: "Tiada sijil ditambah atau ditemui."
  },
  ar: {
    home: "الرئيسية", cert: "الشهادات",
    kicker: "التطوير المهني",
    title: "الشهادات والإنجازات",
    intro: "استكشف إنجازاتي الأكاديمية وتدريبي المهني وخبراتي في القيادة والتطوع.",
    search: "ابحث عن شهادة أو جهة إصدار",
    all: "الكل", technology: "البيانات والتقنية",
    academic: "أكاديمي", leadership: "القيادة",
    volunteering: "التطوع", training: "ورش العمل والتدريب",
    awards: "الجوائز", view: "عرض الشهادة",
    download: "تنزيل", results: "شهادات",
    empty: "لم تتم إضافة شهادات أو لا توجد نتائج."
  },
  zh: {
    home: "首页", cert: "证书",
    kicker: "专业发展",
    title: "证书与成就",
    intro: "探索我的学术成就、专业培训、领导力发展和志愿服务经历。",
    search: "搜索证书或颁发机构",
    all: "全部", technology: "数据与技术",
    academic: "学术", leadership: "领导力",
    volunteering: "志愿服务", training: "研讨会与培训",
    awards: "奖项", view: "查看证书",
    download: "下载", results: "份证书",
    empty: "尚未添加证书或没有匹配结果。"
  }
};

const categories = [
  "all", "technology", "academic",
  "leadership", "volunteering", "training", "awards"
];

let lang = "en";
let activeCategory = "all";

try {
  const saved = localStorage.getItem("portfolioLanguage");
  if (translations[saved]) lang = saved;
} catch (_) {}

const get = id => document.getElementById(id);
const t = key => translations[lang][key];

function render() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

  get("language").value = lang;
  get("homeLink").textContent = t("home");
  get("certLink").textContent = t("cert");
  get("kicker").textContent = t("kicker");
  get("title").textContent = t("title");
  get("intro").textContent = t("intro");
  get("search").placeholder = t("search");
  get("search").setAttribute("aria-label", t("search"));

  get("filters").replaceChildren();

  categories.forEach(category => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "filter";
    button.textContent = t(category);
    button.setAttribute(
      "aria-pressed",
      String(activeCategory === category)
    );
    button.onclick = () => {
      activeCategory = category;
      render();
    };
    get("filters").appendChild(button);
  });

  const query = get("search").value.toLowerCase();

  const filtered = certificates
    .filter(c =>
      (activeCategory === "all" || c.category === activeCategory) &&
      (c.title + " " + c.issuer).toLowerCase().includes(query)
    )
    .sort((a, b) => b.year - a.year);

  get("count").textContent = filtered.length + " " + t("results");
  get("grid").replaceChildren();

  filtered.forEach(c => {
    const card = document.createElement("article");
    card.className = "card";

    const badge = document.createElement("span");
    badge.className = "category";
    badge.textContent = t(c.category);

    const title = document.createElement("h2");
    title.textContent = c.title;

    const issuer = document.createElement("p");
    issuer.textContent = c.issuer;

    const year = document.createElement("p");
    year.textContent = String(c.year);

    const actions = document.createElement("div");
    actions.className = "actions";

    const view = document.createElement("a");
    view.href = c.file;
    view.target = "_blank";
    view.rel = "noopener noreferrer";
    view.className = "view";
    view.textContent = t("view");

    const download = document.createElement("a");
    download.href = c.file;
    download.download = "";
    download.className = "download";
    download.textContent = t("download");

    actions.append(view, download);
    card.append(badge, title, issuer, year, actions);
    get("grid").appendChild(card);
  });

  get("empty").hidden = filtered.length !== 0;
  get("empty").textContent = t("empty");
}

get("language").addEventListener("change", e => {
  lang = e.target.value;
  try {
    localStorage.setItem("portfolioLanguage", lang);
  } catch (_) {}
  render();
});

get("search").addEventListener("input", render);
get("year").textContent = new Date().getFullYear();
render();
</script>
</body>
</html>
